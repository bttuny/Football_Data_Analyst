<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Kirjaudu sisään - Futis Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-content h-screen m-0 flex-col justify-center">

    <div class="bg-slate-900 border border-slate-800 p-8 rounded-xl shadow-2xl w-96">
        <h2 class="text-2xl font-bold mb-6 text-center text-emerald-400">⚽ Futis Analytics</h2>
        <p class="text-xs text-slate-400 text-center mb-6">Kirjaudu sisään jatkaaksesi portfolioon</p>

        <!-- Näytetään virheviesti jos kirjautuminen epäonnistui -->
        <div id="error-msg" class="hidden bg-red-950 border border-red-800 text-red-200 text-xs p-3 rounded mb-4 text-center">
            Väärä käyttäjätunnus tai salasana!
        </div>

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase">Käyttäjätunnus</label>
                <input type="text" name="username" required class="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase">Salasana</label>
                <input type="password" name="password" required class="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold py-2.5 rounded text-sm transition-colors mt-2">
                Kirjaudu sisään
            </button>
        </form>
    </div>

    <script>
        // Tarkistetaanko URL:sta näkyykö virhe
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            document.getElementById('error-msg').classList.remove('hidden');
        }
    </script>
</body>
</html>
